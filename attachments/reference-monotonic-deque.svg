<text x="163.33333333333334" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">EXPIRE FRONT</text>
<text x="163.33333333333334" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">구간 밖 인덱스 제거</text>
<text x="321.6666666666667" y="90" text-anchor="middle" font-family="Arial" font-size="22" fill="#aeb6c0">→</text>
