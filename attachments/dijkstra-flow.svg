<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 188" width="960" height="188" role="img" aria-labelledby="title desc">
  <title id="title">Dijkstra: Pop, Skip, Relax</title>
  <desc id="desc">최소 누적 거리 후보를 꺼낸다. 옛 거리면 건너뛴다. 각 이웃으로 가는 거리가 더 짧으면 갱신하고 새 후보를 힙에 넣는다. 힙이 빌 때까지 반복한다.</desc>
  <style>
    .fg { fill: #e7eaf0; }
    .sub { fill: #b5becb; }
    .line { fill: none; stroke: #687485; stroke-width: 1.5; }
    @media (prefers-color-scheme: light) {
      .fg { fill: #20252d; }
      .sub { fill: #526071; }
      .line { stroke: #9da6b2; }
    }
  </style>
  <g font-family="system-ui,-apple-system,Arial,sans-serif" text-anchor="middle">
    <g class="fg" font-size="29" font-weight="600">
      <text x="155" y="45">POP</text>
      <text x="480" y="45">SKIP</text>
      <text x="805" y="45">RELAX</text>
    </g>
    <g class="sub" font-size="21">
      <text x="155" y="86">최소 누적 거리 후보</text>
      <text x="480" y="86">옛 거리면 건너뛰기</text>
      <text x="805" y="86">더 짧으면 갱신 · 삽입</text>
      <text x="480" y="175" font-size="19">힙이 빌 때까지 반복</text>
    </g>
  </g>
  <g class="line">
    <path d="M279 58 H347 M339 52 L347 58 L339 64"/>
    <path d="M612 58 H680 M672 52 L680 58 L672 64"/>
    <path d="M805 111 V132 H155 V111 M149 119 L155 111 L161 119"/>
  </g>
</svg>
