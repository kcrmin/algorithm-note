<svg xmlns="http://www.w3.org/2000/svg" width="960" height="164" viewBox="0 0 960 164">
<title>Lazy Segment Tree memory cue</title>
<rect width="960" height="164" rx="8" fill="#252a31"/>
<rect x="20.0" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="163.33333333333334" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">APPLY</text>
<text x="163.33333333333334" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">구간 전체에 반영</text>
<text x="321.6666666666667" y="90" text-anchor="middle" font-family="Arial" font-size="22" fill="#aeb6c0">→</text>
<rect x="336.6666666666667" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="480.0" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">PUSH</text>
<text x="480.0" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">자식에게 미룬 값 전달</text>
<text x="638.3333333333334" y="90" text-anchor="middle" font-family="Arial" font-size="22" fill="#aeb6c0">→</text>
<rect x="653.3333333333334" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="796.6666666666667" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">PULL</text>
<text x="796.6666666666667" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">자식 결과로 재계산</text>
</svg>