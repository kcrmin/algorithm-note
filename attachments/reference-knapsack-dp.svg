<svg xmlns="http://www.w3.org/2000/svg" width="960" height="182" viewBox="0 0 960 182"><title>Knapsack: descending once, ascending unlimited</title><rect width="960" height="182" rx="8" fill="#252a31"/>
<rect x="20" y="20" width="445" height="142" rx="6" fill="#30363e" stroke="#626974"/>
<text x="242.5" y="60" text-anchor="middle" fill="#f1f2f4" font-family="Arial,sans-serif" font-size="24" font-weight="600">0/1 · Each Item Once</text>
<text x="242.5" y="101" text-anchor="middle" fill="#e5e8ed" font-family="Menlo,monospace" font-size="21">capacity → weight  ·  c--</text>
<text x="242.5" y="135" text-anchor="middle" fill="#c5cbd3" font-family="Arial,sans-serif" font-size="16">이번 물건으로 갱신한 칸을 다시 쓰지 않음</text>
<rect x="495" y="20" width="445" height="142" rx="6" fill="#30363e" stroke="#626974"/>
<text x="717.5" y="60" text-anchor="middle" fill="#f1f2f4" font-family="Arial,sans-serif" font-size="24" font-weight="600">Unbounded · Reuse Allowed</text>
<text x="717.5" y="101" text-anchor="middle" fill="#e5e8ed" font-family="Menlo,monospace" font-size="21">weight → capacity  ·  c++</text>
<text x="717.5" y="135" text-anchor="middle" fill="#c5cbd3" font-family="Arial,sans-serif" font-size="16">이번 물건으로 갱신한 칸을 다시 사용</text>
</svg>