<svg xmlns="http://www.w3.org/2000/svg" width="960" height="164" viewBox="0 0 960 164">
<title>Edit Distance memory cue</title>
<rect width="960" height="164" rx="8" fill="#252a31"/>
<rect x="20.0" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="163.33333333333334" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">DELETE</text>
<text x="163.33333333333334" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">위 + 1</text>

<rect x="336.6666666666667" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="480.0" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">INSERT</text>
<text x="480.0" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">왼쪽 + 1</text>

<rect x="653.3333333333334" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="796.6666666666667" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">REPLACE</text>
<text x="796.6666666666667" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">대각선 + 0 또는 1</text>
</svg>