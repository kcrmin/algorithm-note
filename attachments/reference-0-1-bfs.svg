<rect x="20.0" y="26" width="286.6666666666667" height="112" rx="6" fill="#30363e" stroke="#626974"/>
<text x="163.33333333333334" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f2f4">POP FRONT</text>
<text x="163.33333333333334" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c5cbd3">가장 가까운 후보</text>

